<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>CodeSplain</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.7.0/build/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/json5/2.2.3/index.min.js"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/lib/codemirror.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/lib/codemirror.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/theme/xq-light.min.css">
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/javascript/javascript.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/python/python.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/clike/clike.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/xml/xml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/css/css.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/htmlmixed/htmlmixed.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/ruby/ruby.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/sql/sql.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/php/php.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/addon/edit/matchbrackets.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/addon/edit/closebrackets.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="title"><i class="fas fa-code"></i> <span class="logo-beta">CodeSplain</span></h1>
            <div class="header-buttons">
                <button id="examples-btn" class="btn btn-secondary tooltip"><i class="fas fa-lightbulb"></i> Examples<span
                    class="tooltip-text">Load code examples</span></button>
                <button id="theme-toggle" class="theme-toggle tooltip"><i class="fas fa-moon"></i><span
                    class="tooltip-text">Toggle dark mode</span></button>
            </div>
        </div>
        <div class="card">
            <h2 class="section-title"><i class="fas fa-keyboard"></i> Your Code</h2>
            <div class="code-input-container">
                <textarea id="code-input" placeholder="Paste your code here..."></textarea>
            </div>
            <div class="control-area">
                <div class="control-group"><label class="control-label" for="language-select">Programming
                Language</label><select id="language-select" class="select-input">
                <option value="auto">Auto-detect</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="csharp">C#</option>
                <option value="go">Go</option>
                <option value="php">PHP</option>
                <option value="ruby">Ruby</option>
                <option value="swift">Swift</option>
                <option value="typescript">TypeScript</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="sql">SQL</option>
                <option value="bash">Bash</option>
            </select></div>
                <div class="control-group level-control"><label class="control-label" for="education-level">Explanation
                Level</label>
                    <div style="display:flex;align-items:center;gap:10px;width:100%;"><input type="range"
                                                                                         id="education-level"
                                                                                         class="level-slider" min="1"
                                                                                         max="4" value="2" step="1">
                        <div id="level-value" class="level-value">Intermediate</div>
                    </div>
                </div>
            </div>
            <div class="control-group"><label class="control-label">Focus Areas (Optional)</label>
                <div class="focus-area">
                    <div class="focus-chip" data-focus="algorithm">Algorithm</div>
                    <div class="focus-chip" data-focus="performance">Performance</div>
                    <div class="focus-chip" data-focus="security">Security</div>
                    <div class="focus-chip" data-focus="best-practices">Best Practices</div>
                </div>
            </div>
            <div class="btn-group" style="margin-top:15px;">
                <button id="explain-btn" class="btn btn-primary"><i class="fas fa-magic"></i> Explain Code</button>
                <button id="format-btn" class="btn btn-secondary"><i class="fas fa-indent"></i> Format Code</button>
                <button id="clear-btn" class="btn btn-secondary"><i class="fas fa-eraser"></i> Clear</button>
            </div>
        </div>
        <div id="explanation-card" class="card" style="display:none;">
            <h2 class="section-title"><i
            class="fas fa-lightbulb"></i> Explanation</h2>
            <div id="loading-indicator" class="loading" style="display:none;">
                <div class="loading-spinner"></div>
                <p>Analyzing your code...</p>
            </div>
            <div id="explanation-content" class="explanation-content"></div>
            <div class="btn-group" style="margin-top:15px;">
                <button id="copy-btn" class="btn btn-secondary tooltip"><i class="fas fa-copy"></i> Copy Explanation<span
                    class="tooltip-text">Copy to clipboard</span></button>
                <button id="save-btn" class="btn btn-accent tooltip"><i class="fas fa-bookmark"></i> Save Explanation<span
                    class="tooltip-text">Save for later</span></button>
            </div>
        </div>
        <div id="saved-card" class="card" style="display:none;">
            <h2 class="section-title"><i class="fas fa-history"></i>
                Saved Explanations</h2>
            <div class="search-box"><i class="fas fa-search search-icon"></i><input type="text" id="search-input"
                                                                                class="search-input"
                                                                                placeholder="Search saved explanations...">
            </div>
            <div class="import-export-buttons">
                <button id="export-btn" class="btn btn-secondary tooltip"><i class="fas fa-file-export"></i> Export All<span
                    class="tooltip-text">Export as JSON</span></button>
                <button id="import-btn" class="btn btn-secondary tooltip"><i class="fas fa-file-import"></i> Import<span
                    class="tooltip-text">Import from JSON</span></button>
                <input type="file" id="import-file" class="input-file" accept=".json">
            </div>
            <div id="saved-list"></div>
        </div>
        <div id="examples-modal" class="modal">
            <div class="modal-content">
                <h2 class="section-title"><i class="fas fa-lightbulb"></i> Code Examples</h2>
                <p>Select a code example to load into the editor:</p>
                <div class="examples-grid" id="examples-grid"></div>
                <span class="modal-close">&times;</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="../logo.js"></script>
</body>

</html>
