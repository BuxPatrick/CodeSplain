// Initialize
document.addEventListener('DOMContentLoaded', () => {
    // Setup CodeMirror for syntax highlighting
    setupCodeMirror();

    // Update education level label

    // Load saved explanations
    displaySavedExplanations();

    // Check for theme preference

    // Populate code examples
    populateExamples();
});

// Setup CodeMirror for syntax highlighting
function setupCodeMirror() {
    codeMirror = CodeMirror.fromTextArea(codeInput, {
        lineNumbers: true,
        mode: 'javascript',
        theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dracula' : 'xq-light',
        lineWrapping: true,
        matchBrackets: true,
        autoCloseBrackets: true,
        indentUnit: 2,
        tabSize: 2,
        viewportMargin: Infinity,
        extraKeys: {
            'Tab': function (cm) {
                cm.replaceSelection('  ', 'end');
            }
        }
    });

    // Set height
    codeMirror.setSize(null, 200);
}

// Event listeners
educationLevel.addEventListener('input', updateLevelLabel);
explainBtn.addEventListener('click', explainCode);
formatBtn.addEventListener('click', formatCode);
clearBtn.addEventListener('click', clearCode);
copyBtn.addEventListener('click', copyExplanation);
saveBtn.addEventListener('click', saveExplanation);
themeToggle.addEventListener('click', toggleTheme);
languageSelect.addEventListener('change', updateCodeMirrorMode);
examplesBtn.addEventListener('click', () => examplesModal.style.display = 'flex');
modalClose.addEventListener('click', () => examplesModal.style.display = 'none');
searchInput.addEventListener('input', handleSearch);
exportBtn.addEventListener('click', exportExplanations);

// When clicking outside the modal, close it

        examplesModal.style.display = 'none';
    }
});

// Focus chips toggle
focusChips.forEach(chip => {
    chip.addEventListener('click', () => {
        chip.classList.toggle('active');
    });
});

// Update the education level label
function updateLevelLabel() {
    levelValue.textContent = levels[educationLevel.value - 1];

    // Add animation
    levelValue.style.animation = 'none';
    setTimeout(() => {
        levelValue.style.animation = 'pulse 0.5s ease';
    }, 10);
}

// Update CodeMirror mode based on language selection
function updateCodeMirrorMode() {
    const language = languageSelect.value;
    let mode;

    switch (language) {
        case 'javascript':
        case 'typescript':
            mode = 'javascript';
            break;
        case 'html':
            mode = 'htmlmixed';
            break;
        case 'python':
            mode = 'python';
            break;
        case 'java':
        case 'cpp':
        case 'csharp':
            mode = 'clike';
            break;
        case 'css':
            mode = 'css';
            break;
        case 'php':
            mode = 'php';
            break;
        case 'ruby':
            mode = 'ruby';
            break;
        case 'sql':
            mode = 'sql';
            break;
        default:
            mode = 'javascript';
    }

    codeMirror.setOption('mode', mode);
}

// Toggle between light and dark mode
function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';

    if (isDark) {
        html.setAttribute('data-theme', 'light');
        themeToggle.innerHTML = '<i class="fas fa-moon"></i><span class="tooltip-text">Toggle dark mode</span>';
        localStorage.setItem('theme', 'light');
        codeMirror.setOption('theme', 'xq-light');
    } else {
        html.setAttribute('data-theme', 'dark');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i><span class="tooltip-text">Toggle light mode</span>';
        localStorage.setItem('theme', 'dark');
        codeMirror.setOption('theme', 'dracula');
    }
}

// Initialize theme based on preference
function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i><span class="tooltip-text">Toggle light mode</span>';
        if (codeMirror) codeMirror.setOption('theme', 'dracula');
    } else if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        if (codeMirror) codeMirror.setOption('theme', 'xq-light');
    }
}

// Format code with indentation
function formatCode() {
    try {
        const code = codeMirror.getValue();
        if (!code.trim()) return;

        const language = languageSelect.value;
        let formattedCode = code;

        // Basic formatting for different languages
        if (language === 'javascript' || language === 'typescript') {
            // Use JSON formatting as a basic formatter for JS
            try {
                // Try to parse and stringify as JSON - only works for valid JSON
                const parsed = JSON.parse(code);
                formattedCode = JSON.stringify(parsed, null, 2);
            } catch (e) {
                // Not valid JSON, skip formatting
                formattedCode = code;
            }
        }

        codeMirror.setValue(formattedCode);

        // Auto-select language if on auto
        if (language === 'auto') {
            detectLanguage(code);
        }

        showNotification('Code formatted!');
    } catch (error) {
        showError('Could not format code');
    }
}

// Try to detect language from code
function detectLanguage(code) {
    const patterns = {
        python: /def\s+\w+\s*\(|import\s+\w+|from\s+\w+\s+import|#.*|class\s+\w+:/i,
        javascript: /const\s+|let\s+|var\s+|function\s+|=>\s*{|async\s+|await\s+|console\.|document\.|window\./i,
        html: /<html|<body|<div|<p>|<head|<!DOCTYPE html>/i,
        css: /{[^}]*\s*[\w-]+\s*:\s*[^;]+;/i,
        java: /public\s+class|private\s+|protected\s+|import\s+java|System\.out/i,
        cpp: /#include\s+<|using\s+namespace|std::|cout\s+<<|cin\s+>>/i,
        sql: /SELECT\s+|INSERT\s+INTO|UPDATE\s+|DELETE\s+FROM|CREATE\s+TABLE/i,
        php: /<\?php|\$\w+\s*=|echo\s+/i,
        ruby: /def\s+\w+|require\s+|puts\s+|attr_accessor/i,
    };

    for (const [lang, pattern] of Object.entries(patterns)) {
        if (pattern.test(code)) {
            // Find the option with this value
            for (let i = 0; i < languageSelect.options.length; i++) {
                if (languageSelect.options[i].value === lang) {
                    languageSelect.selectedIndex = i;
                    updateCodeMirrorMode();
                    return;
                }
            }
        }
    }
}

// Main function to get code explanation
async function explainCode() {
    const code = codeMirror.getValue().trim();

    if (!code) {
        showError('Please enter some code to explain');
        return;
    }

    // If code is too long, confirm with user
    if (code.length > 5000) {
        if (!confirm('Your code is quite long. The explanation might be truncated. Continue?')) {
            return;
        }
    }

    const level = levels[educationLevel.value - 1];
    const language = languageSelect.value;

    // Get selected focus areas
    const focusAreas = Array.from(document.querySelectorAll('.focus-chip.active'))
        .map(chip => chip.dataset.focus);

    // Show UI elements
    explanationCard.style.display = 'block';
    loadingIndicator.style.display = 'flex';
    explanationContent.style.display = 'none';
    copyBtn.style.display = 'none';
    saveBtn.style.display = 'none';

    // Disable button while loading
    explainBtn.disabled = true;
    explainBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';

    try {
        const explanation = await getExplanation(code, language, level, focusAreas);
        displayExplanation(explanation, code, language, level, focusAreas);
    } catch (error) {
        explanationContent.textContent = 'Sorry, an error occurred while analyzing your code. Please try again.';
        explanationContent.style.display = 'block';
    } finally {
        loadingIndicator.style.display = 'none';
        explainBtn.disabled = false;
        explainBtn.innerHTML = '<i class="fas fa-magic"></i> Explain Code';
        copyBtn.style.display = 'inline-flex';
        saveBtn.style.display = 'inline-flex';
    }
}

// API call to get explanation
async function getExplanation(code, language, level, focusAreas = []) {
    const langStr = language !== 'auto' ? language : 'the code';

    let focusInstructions = '';
    if (focusAreas.length > 0) {
        focusInstructions = `\nPlease focus especially on these areas: ${focusAreas.join(', ')}.`;
    }

    const prompt = `You are an AI code explainer. Analyze the code and provide a clear explanation.
Format your response as JSON with this structure:
{
  "language": "detected language",
  "explanation": "detailed explanation of what the code does, how it works, etc.",
  "summary": "brief one-line summary of the code"
}
Adjust your explanation to a ${level.toLowerCase()} level.${focusInstructions}

Please explain this ${language !== 'auto' ? language : ''} code:
\`\`\`
${code}
\`\`\`
Explain at a ${level} level.${focusInstructions}`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=AIzaSyC-7sQPBBbbPxAHwOdNZs_Uf4KmjUwh-DQ`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{
                        text: prompt
                    }]
                }],
                generationConfig: {
                    temperature: 0.3,
                    maxOutputTokens: 1500
                }
            })
        });

        if (!response.ok) {
            throw new Error('Failed to get explanation');
        }

        const data = await response.json();
        
        // Extract the text from Gemini's response
        const content = data.candidates[0].content.parts[0].text;

        // Try to parse JSON from response
        try {
            // Extract JSON part from the response
            const jsonMatch = content.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
                return JSON5.parse(jsonMatch[0]);
            }
        } catch (e) {
            console.error('Error parsing JSON:', e);
        }

        // Fallback if JSON parsing fails
        return {
            language: language !== 'auto' ? language : 'unknown',
            explanation: content,
            summary: 'Code explanation'
        };
    } catch (error) {
        console.error('Error calling Gemini API:', error);
        throw error;
    }
}

// Display explanation in the UI
function displayExplanation(result, code, language, level, focusAreas = []) {
    explanationContent.textContent = result.explanation;
    explanationContent.style.display = 'block';

    // Store current explanation data
    currentExplanation = {
        code: code,
        language: result.language || language,
        explanation: result.explanation,
        summary: result.summary || 'Code explanation',
        level: level,
        focusAreas: focusAreas,
        timestamp: new Date().toISOString()
    };
}

// Clear code input
function clearCode() {
    if (codeMirror.getValue().trim() && !confirm('Are you sure you want to clear your code?')) {
        return;
    }

    codeMirror.setValue('');

    // Clear active focus areas
    document.querySelectorAll('.focus-chip.active').forEach(chip => {
        chip.classList.remove('active');
    });

    // Optionally hide explanation if shown
    if (explanationCard.style.display !== 'none') {
        if (confirm('Also clear the current explanation?')) {
            explanationCard.style.display = 'none';
            currentExplanation = null;
        }
    }
}

// Copy explanation to clipboard
function copyExplanation() {
    const text = explanationContent.textContent;

    if (!text) return;

    navigator.clipboard.writeText(text)
        .then(() => {
            showNotification('Explanation copied to clipboard!');
        })
        .catch(() => {
            showError('Failed to copy to clipboard');
        });
}

// Save current explanation
function saveExplanation() {
    if (!currentExplanation) {
        showError('No explanation to save');
        return;
    }

    // Add to saved explanations
    savedExplanations.push(currentExplanation);
    localStorage.setItem('savedExplanations', JSON.stringify(savedExplanations));

    // Update UI
    displaySavedExplanations();
    showNotification('Explanation saved successfully!');

    // Animate save button
    saveBtn.classList.add('btn-success');
    saveBtn.innerHTML = '<i class="fas fa-check"></i> Saved!';

    setTimeout(() => {
        saveBtn.classList.remove('btn-success');
        saveBtn.innerHTML = '<i class="fas fa-bookmark"></i> Save Explanation';
    }, 2000);
}

// Display saved explanations
function displaySavedExplanations() {
    if (savedExplanations.length === 0) {
        savedCard.style.display = 'none';
        return;
    }

    savedCard.style.display = 'block';

    // Get search term
    const searchTerm = searchInput.value.toLowerCase().trim();
    const filteredExplanations = searchTerm ?
        savedExplanations.filter(item =>
            item.summary.toLowerCase().includes(searchTerm) ||
            item.language.toLowerCase().includes(searchTerm) ||
            (item.focusAreas && item.focusAreas.some(area => area.toLowerCase().includes(searchTerm)))
        ) :
        savedExplanations;

    // Sort by newest first
    filteredExplanations.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    savedList.innerHTML = '';

    if (filteredExplanations.length === 0) {
        savedList.innerHTML = '<div class="no-results">No matching explanations found</div>';
        return;
    }

    filteredExplanations.forEach((item, index) => {
        const originalIndex = savedExplanations.findIndex(exp => exp.timestamp === item.timestamp);
        const date = new Date(item.timestamp).toLocaleDateString();

        const savedItem = document.createElement('div');
        savedItem.className = 'saved-item';

        let focusAreasHtml = '';
        if (item.focusAreas && item.focusAreas.length) {
            focusAreasHtml = item.focusAreas.map(area =>
                `<span class="code-badge">${area}</span>`
            ).join('');
        }

        savedItem.innerHTML = `
      <div class="saved-info">
        <div class="saved-title">${item.summary}</div>
        <div class="saved-meta">
          <span class="code-badge">${item.language}</span>
          <span>${item.level} level • ${date}</span>
          ${focusAreasHtml}
        </div>
      </div>
      <div class="action-buttons">
        <button class="btn btn-secondary tooltip load-btn">
          <i class="fas fa-eye"></i>
          <span class="tooltip-text">Load explanation</span>
        </button>
        <button class="btn btn-danger tooltip delete-btn">
          <i class="fas fa-trash"></i>
          <span class="tooltip-text">Delete</span>
        </button>
      </div>
    `;

        // Add event listeners
        savedItem.querySelector('.load-btn').addEventListener('click', () => loadExplanation(originalIndex));
        savedItem.querySelector('.delete-btn').addEventListener('click', () => deleteExplanation(originalIndex));

        savedList.appendChild(savedItem);
    });
}

// Search saved explanations
function handleSearch() {
    if (searchTimeout) {
        clearTimeout(searchTimeout);
    }

    searchTimeout = setTimeout(() => {
        displaySavedExplanations();
    }, 300);
}

// Load a saved explanation
function loadExplanation(index) {
    const item = savedExplanations[index];

    // Fill the code input
    codeMirror.setValue(item.code);

    // Set language if possible
    for (let i = 0; i < languageSelect.options.length; i++) {
        if (languageSelect.options[i].value === item.language.toLowerCase()) {
            languageSelect.selectedIndex = i;
            updateCodeMirrorMode();
            break;
        }
    }

    // Set education level
    const levelIndex = levels.findIndex(level => level === item.level);
    if (levelIndex !== -1) {
        educationLevel.value = levelIndex + 1;
        updateLevelLabel();
    }

    // Reset focus chips
    document.querySelectorAll('.focus-chip').forEach(chip => {
        chip.classList.remove('active');
    });

    // Set focus areas if available
    if (item.focusAreas && item.focusAreas.length) {
        item.focusAreas.forEach(area => {
            const chip = document.querySelector(`.focus-chip[data-focus="${area}"]`);
            if (chip) chip.classList.add('active');
        });
    }

    // Display explanation
    explanationCard.style.display = 'block';
    explanationContent.textContent = item.explanation;

    // Set current explanation
    currentExplanation = item;

    // Scroll to explanation
    explanationCard.scrollIntoView({behavior: 'smooth'});

    // Show notification
    showNotification('Explanation loaded!');
}

// Delete a saved explanation
function deleteExplanation(index) {
    if (!confirm('Are you sure you want to delete this explanation?')) {
        return;
    }

    savedExplanations.splice(index, 1);
    localStorage.setItem('savedExplanations', JSON.stringify(savedExplanations));
    displaySavedExplanations();
    showNotification('Explanation deleted');
}

// Export saved explanations as JSON
function exportExplanations() {
    if (savedExplanations.length === 0) {
        showError('No explanations to export');
        return;
    }

    const dataStr = JSON.stringify(savedExplanations, null, 2);
    const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);

    const exportFileName = `code-explanations-${new Date().toISOString().slice(0, 10)}.json`;

    const linkElement = document.createElement('a');
    linkElement.setAttribute('href', dataUri);
    linkElement.setAttribute('download', exportFileName);
    document.body.appendChild(linkElement);
    linkElement.click();
    document.body.removeChild(linkElement);

    showNotification('Explanations exported successfully!');
}

// Import explanations from JSON file
function importExplanations(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
        try {
            const importedData = JSON.parse(e.target.result);

            if (!Array.isArray(importedData)) {
                throw new Error('Invalid format');
            }

            const validExplanations = importedData.filter(item =>
                item.code && item.explanation && item.language && item.timestamp
            );

            if (validExplanations.length === 0) {
                throw new Error('No valid explanations found');
            }

            // Merge with existing explanations, avoiding duplicates
            const existingTimestamps = savedExplanations.map(item => item.timestamp);
            const newExplanations = validExplanations.filter(item =>
                !existingTimestamps.includes(item.timestamp)
            );

            if (newExplanations.length === 0) {
                showNotification('No new explanations to import');
                return;
            }

            savedExplanations = [...savedExplanations, ...newExplanations];
            localStorage.setItem('savedExplanations', JSON.stringify(savedExplanations));
            displaySavedExplanations();

            showNotification(`Imported ${newExplanations.length} explanations`);
        } catch (error) {
            showError('Failed to import: Invalid file format');
        }
    };
    reader.readAsText(file);

    // Reset the input
    importFile.value = '';
}

// Populate code examples
function populateExamples() {
    examplesGrid.innerHTML = '';

    codeExamples.forEach((example, index) => {
        const exampleCard = document.createElement('div');
        exampleCard.className = 'example-card';
        exampleCard.innerHTML = `
      <div class="example-title">
        <i class="fas fa-code"></i> ${example.title}
      </div>
      <div class="example-desc">${example.description}</div>
    `;

        exampleCard.addEventListener('click', () => {
            codeMirror.setValue(example.code);

            // Set language
            for (let i = 0; i < languageSelect.options.length; i++) {
                if (languageSelect.options[i].value === example.language) {
                    languageSelect.selectedIndex = i;
                    updateCodeMirrorMode();
                    break;
                }
            }

            examplesModal.style.display = 'none';
        });

        examplesGrid.appendChild(exampleCard);
    });
}

// Show error message
function showError(message) {
    const errorDiv = document.createElement('div');
    errorDiv.className = 'code-error';
    errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;

    // Remove any existing error
    const existingError = document.querySelector('.code-error');
    if (existingError) {
        existingError.remove();
    }

    // Insert after code input container
    document.querySelector('.code-input-container').after(errorDiv);

    // Auto remove after 5 seconds
    setTimeout(() => {
        errorDiv.remove();
    }, 5000);
}

// Show notification
function showNotification(message) {
    // Remove existing notification
    const existingNotification = document.querySelector('.copy-success');
    if (existingNotification) {
        existingNotification.remove();
    }

    const notification = document.createElement('div');
    notification.className = 'copy-success';
    notification.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;

    document.body.appendChild(notification);

    // Auto remove after animation completes
    setTimeout(() => {
        notification.remove();
    }, 3000);
}
